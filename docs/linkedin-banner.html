<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    background: #f5f1e8;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background-image:
      linear-gradient(rgba(3,2,19,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(3,2,19,0.045) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .eq {
    position: absolute;
    font-family: 'Caveat', cursive;
    white-space: nowrap;
    user-select: none;
  }

  .headline {
    position: absolute;
    right: 96px;
    top: 118px;
    text-align: right;
    font-size: 66px;
    font-weight: 400;
    color: #030213;
    letter-spacing: -2px;
    line-height: 1.14;
  }

  .headline .accent { color: #1e6bb8; }

  .sub {
    position: absolute;
    right: 96px;
    top: 296px;
    text-align: right;
    font-size: 25px;
    font-weight: 400;
    color: rgba(3,2,19,0.5);
    letter-spacing: -0.3px;
  }
</style>
</head>
<body>

<div class="banner">
  <div class="eq" style="top: 132px; left: 310px; font-size: 38px; color: rgba(3,2,19,0.26); transform: rotate(-7deg);">&#8747;&#8320;&#185; x&#178; dx = &#8531;</div>
  <div class="eq" style="top: 196px; left: 420px; font-size: 34px; color: rgba(3,2,19,0.22); transform: rotate(4deg);">y = mx + b</div>
  <div class="eq" style="top: 268px; left: 330px; font-size: 32px; color: rgba(3,2,19,0.2);  transform: rotate(-4deg);">sin&#178;&#952; + cos&#178;&#952; = 1</div>
  <div class="eq" style="top: 174px; left: 600px; font-size: 30px; color: rgba(3,2,19,0.16); transform: rotate(6deg);">x&#178; + y&#178; = r&#178;</div>

  <div class="headline">A math tutor that<br>works it out <span class="accent">with you</span></div>

  <div class="sub">Voice-first AI tutoring. Step by step. Until it clicks.</div>
</div>

</body>
</html>
